<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pocket Hell 2.0</title>
  <desc id="desc">A premium retro handheld containing a playable green monochrome raycasting FPS.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172019"/><stop offset="0.55" stop-color="#0c120e"/><stop offset="1" stop-color="#080b09"/></linearGradient><radialGradient id="halo"><stop stop-color="#92ae58" stop-opacity=".28"/><stop offset="1" stop-color="#92ae58" stop-opacity="0"/></radialGradient><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ec"/><stop offset=".46" stop-color="#d9d7ce"/><stop offset="1" stop-color="#aaa99f"/></linearGradient><linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#555a56"/><stop offset="1" stop-color="#202522"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8bb61"/><stop offset="1" stop-color="#768743"/></linearGradient><linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a94578"/><stop offset="1" stop-color="#571d40"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce5d9" stroke-opacity=".035"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#0f380f" opacity=".11"/></pattern></defs>
  <rect width="1280" height="720" fill="url(#background)"/><rect width="1280" height="720" fill="url(#grid)"/><ellipse cx="808" cy="342" rx="470" ry="360" fill="url(#halo)"/>
  <g font-family="Inter,Arial,sans-serif"><g transform="translate(70 64)"><rect width="43" height="43" rx="12" fill="#151c17" stroke="#dce5d9" stroke-opacity=".25"/><path d="M9 21h20M19 11v20" stroke="#cee49a" stroke-width="5" stroke-linecap="round"/><circle cx="34" cy="15" r="3" fill="#cee49a"/><circle cx="29" cy="25" r="3" fill="#cee49a"/><text x="58" y="19" fill="#f4f1e7" font-family="ui-monospace,monospace" font-size="17" font-weight="800" letter-spacing="2">POCKET HELL</text><text x="58" y="39" fill="#a6bd70" font-family="ui-monospace,monospace" font-size="10" font-weight="800" letter-spacing="2">RAYCASTER // BUILD 2.0</text></g><g transform="translate(70 190)"><text fill="#a6bd70" font-family="ui-monospace,monospace" font-size="12" font-weight="800" letter-spacing="2">A TINY FPS ENGINE YOU CAN HOLD</text><text y="78" fill="#f4f1e7" font-size="58" font-weight="850" letter-spacing="-3">Play the code.</text><text y="139" fill="#f4f1e7" font-size="58" font-weight="850" letter-spacing="-3">Learn the engine.</text><text y="191" fill="#9ba49c" font-size="20">A real TypeScript raycaster, interactive controls,</text><text y="222" fill="#9ba49c" font-size="20">procedural media and a GitHub-powered leaderboard.</text><g transform="translate(0 271)" font-family="ui-monospace,monospace" font-size="11" font-weight="800"><rect width="156" height="42" rx="11" fill="#cee49a"/><text x="23" y="26" fill="#101611">PLAY IN BROWSER</text><rect x="170" width="146" height="42" rx="11" fill="#151c17" stroke="#e1e8df" stroke-opacity=".16"/><text x="194" y="26" fill="#e1e8df">VIEW SOURCE ↗</text></g></g></g>
  <g transform="translate(750 35)"><rect width="400" height="640" rx="27" fill="url(#shell)" stroke="#7c7d76" stroke-opacity=".55"/><path d="M8 14h384M8 18h384" stroke="#777971" stroke-opacity=".2"/><text x="28" y="46" fill="#424a44" font-family="ui-monospace,monospace" font-size="8" font-weight="800" letter-spacing="2">POCKET SYSTEM</text><g transform="translate(27 62)"><rect width="346" height="272" rx="20" fill="url(#bezel)" stroke="#181c19"/><circle cx="24" cy="24" r="4" fill="#e0543d"/><rect x="24" y="39" width="298" height="207" rx="8" fill="#152018" stroke="#101411" stroke-width="8"/><rect x="31" y="46" width="284" height="193" rx="3" fill="url(#screen)"/><rect x="31" y="46" width="284" height="193" fill="url(#scan)"/><g stroke="#263a20" stroke-width="11" fill="none"><path d="M34 132L78 85 127 126 166 80 211 125 256 88 312 137"/><path d="M34 196L85 160 134 190 179 151 228 191 312 151"/></g><g fill="#263a20"><path d="M162 106l20 14-8 24h-25l-7-24z"/><rect x="154" y="143" width="20" height="34"/><rect x="141" y="148" width="47" height="11"/><path d="M150 177l-10 34h15l9-23 9 23h16l-11-34z"/></g></g><text x="31" y="365" fill="#334d76" font-family="ui-monospace,monospace" font-size="20" font-weight="900">POCKET <tspan fill="#7c345e" font-style="italic" font-size="24">HELL</tspan></text><g transform="translate(45 410)" fill="#232825"><rect x="42" width="44" height="128" rx="8"/><rect y="42" width="128" height="44" rx="8"/><circle cx="64" cy="64" r="21" fill="#171b18"/></g><g transform="translate(278 450) rotate(-10)"><circle cy="45" r="34" fill="url(#button)" stroke="#4b1737" stroke-width="4"/><circle cx="67" r="34" fill="url(#button)" stroke="#4b1737" stroke-width="4"/></g></g><text x="70" y="675" fill="#7f8b80" font-family="ui-monospace,monospace" font-size="11" font-weight="800" letter-spacing="2">PLAY · LEARN · MODIFY · SHARE</text>
</svg>

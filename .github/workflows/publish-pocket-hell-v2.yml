name: Publish Pocket Hell v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pocket-hell-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch and verify Pocket Hell v2 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/pocket-hell-v2-final
          git show origin/feat/pocket-hell-v2-final:.github/v2-final/payload.tar.gz.b64 > /tmp/pocket-hell-v2.b64
          base64 --decode /tmp/pocket-hell-v2.b64 > /tmp/pocket-hell-v2.tar.gz
          echo "479d8fc29367b123cca7e5299d7b9a77b4657be59b95d389335464b8cb9d75d0  /tmp/pocket-hell-v2.tar.gz" | sha256sum --check

      - name: Replace repository with verified v2 project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pocket-hell-v2.tar.gz -C .
          touch .nojekyll public/.nojekyll

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository
        run: npm run validate

      - name: Type-check and build
        run: npm run build

      - name: Commit verified Pocket Hell v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch premium game-first Pocket Hell v2"
          git push origin HEAD:main

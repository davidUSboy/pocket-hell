name: Apply premium Pocket Hell update

on:
  push:
    branches:
      - feat/premium-game-first
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v7
        with:
          ref: feat/premium-game-first
          fetch-depth: 0

      - name: Unpack premium game-first build
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/premium-update.tar.gz.b64 > /tmp/pocket-hell-premium.tar.gz
          tar -xzf /tmp/pocket-hell-premium.tar.gz -C .
          rm -f .github/premium-update.tar.gz.b64
          rm -f .github/workflows/apply-premium-update.yml
          rm -f UPLOAD-NOTES.txt

      - name: Commit prepared project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship premium game-first Pocket Hell v1.1"
          git push origin HEAD:feat/premium-game-first

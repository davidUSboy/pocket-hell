name: Finalize Pocket Hell repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag and remove temporary setup files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/finalize.yml
          git commit -m "chore: complete repository setup"

          if ! git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            git tag -a v1.0.0 -m "Pocket Hell v1.0.0"
          fi

          git push origin HEAD:main
          git push origin refs/tags/v1.0.0
          git push origin --delete docs/pages-setup || true

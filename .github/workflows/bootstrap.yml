name: Bootstrap Pocket Hell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00
          cat .bootstrap/chunk-* > /tmp/pocket-hell.b64
          base64 --decode /tmp/pocket-hell.b64 > /tmp/pocket-hell.tar.gz
          mkdir -p /tmp/pocket-hell
          tar -xzf /tmp/pocket-hell.tar.gz -C /tmp/pocket-hell
          rsync -a /tmp/pocket-hell/ ./
          rm -rf .bootstrap

      - name: Publish restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch Pocket Hell v1.0.0"
          git push origin HEAD:main
